name: Auto Tag & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan workflow dijalankan manual dari tab Actions

permissions:
  contents: write # Izin wajib agar GitHub bisa membuat Tag dan Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Mengambil seluruh riwayat tag yang sudah ada

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Beri Izin Eksekusi Gradle
        run: chmod +x ./gradlew

      - name: Compile Kode menjadi APK (Debug)
        run: ./gradlew assembleDebug

      - name: Generate Auto Tag Versi Baru
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Create Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$NEW_TAG" app/build/outputs/apk/debug/*.apk \
            --target "${{ github.sha }}" \
            --title "Release $NEW_TAG" \
            --generate-notes