name: topo_survey
description: Alat survei topografi Android (trilaterasi BLE + GPS + barometer).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12
  flutter_ble_peripheral: ^1.2.0
  geolocator: ^13.0.1
  sensors_plus: ^6.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  sqflite: ^2.3.3+1

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0